<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body{height:100%;margin:0}
  body{padding:8px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;
    font-family:sans-serif;font-size:13px;color:#333;background:transparent}
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  img{display:none;width:100%;height:100%;object-fit:contain}
  img.active{display:block}
  select{flex:0 0 auto;border:none;border-bottom:1px solid #ccc;background:none;font:inherit;color:inherit}
</style>
</head>
<body>
<div id="stage"></div>
<select id="picker"></select>
<script>
  // widget.html?img=a.png&label=Before&img=b.png&label=After
  const params = new URLSearchParams(location.search);
  const imgs = params.getAll('img');
  const labels = params.getAll('label');
  const stage = document.getElementById('stage');
  const picker = document.getElementById('picker');

  if (!imgs.length) {
    stage.textContent = 'No images provided.';
    picker.remove();
  } else {
    const els = imgs.map((src, i) => {
      const img = new Image();
      img.src = src;
      img.alt = labels[i] || `Option ${i + 1}`;
      img.className = i === 0 ? 'active' : '';
      stage.appendChild(img);
      return img;
    });
    imgs.forEach((_, i) => picker.add(new Option(labels[i] || `Option ${i + 1}`, i)));
    picker.onchange = () => {
      const selected = Number(picker.value);
      els.forEach((img, j) => img.classList.toggle('active', j === selected));
    };
  }
</script>
</body>
</html>
