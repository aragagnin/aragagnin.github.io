<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Stack</title>

  <style>
    html, body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size:small;
      margin: 0;
      height: 100%;
      background-color:black;
      
    }
    
    body {
      overflow: hidden;
    }
    a {color:cyan}
    header {
      color:white;
      height: 2em;
      text-align: center;
    }

    main {
      position: absolute;
      top: 2em;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      touch-action: none;
    }

    main img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: auto;
      max-width: 100%;
      pointer-events: none;
      user-select: none;
    }

    #a { height: 100%; }
    #b { height: 25%; }
    #c { height: 6.25%; }
  
  </style>
</head>

<body>

  <header>
    (Springel et al. <a href="https://ui.adsabs.harvard.edu/abs/2005Natur.435..629S/abstract">2005</a>)
       Images credits: <a href="https://wwwmpa.mpa-garching.mpg.de/galform/virgo/millennium/">Millennium simulation</a>
      <div class="lens">
  <span class="icon">🔍</span>
  <span class="txt">scroll to zoom!</span>
</div>

<style>
.lens{
  display:inline-flex; align-items:center; height:26px;
  max-width:26px; overflow:hidden; border-radius:13px;
  background:#3454d1; color:#fff; cursor:default;
  transition:max-width .2s ease;
  margin-left:1em;
}
.lens:hover{ max-width:170px; animation-play-state:paused; }
.lens .icon{ flex:0 0 26px; display:flex; align-items:center; justify-content:center; }
.lens .txt{ font:11px monospace; white-space:nowrap; padding-right:10px; }

/*
.lens{  animation: shake 2s infinite; }
@keyframes shake{
  0%, 90%, 100%{ transform:translateX(0); }
  91%{ transform:translateX(-2px); }
  93%{ transform:translateX(2px); }
  95%{ transform:translateX(-2px); }
  97%{ transform:translateX(2px); }
}
*/
</style>
  </header>

  <main>
    <img src="https://wwwmpa.mpa-garching.mpg.de/galform/virgo/millennium/seqB_063a_half.jpg" id="a">
    <img src="https://wwwmpa.mpa-garching.mpg.de/galform/virgo/millennium/seqD_063a_half.jpg" id="b">
    <img src="https://wwwmpa.mpa-garching.mpg.de/galform/virgo/millennium/seqF_063a.jpg" id="c">
  </main>

  <script>
    const main = document.querySelector('main');
    const images = document.querySelectorAll('main img');

    let zoom = 1;
    let x = 0;
    let y = 0;

    let lastDistance = null;
    let lastX = 0;
    let lastY = 0;

    function update() {
      images.forEach(img => {
        img.style.transform =
          `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${zoom})`;
      });
    }

    function setZoom(value) {
      zoom = Math.max(0.1, Math.min(500, value));
      update();
    }

    // Desktop: mouse wheel zoom
    main.addEventListener('wheel', e => {
      e.preventDefault();

      setZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9));
    }, { passive: false });


    // Mobile: touch start
    main.addEventListener('touchstart', e => {

      // Start pinch
      if (e.touches.length === 2) {
        lastDistance = distance(e.touches[0], e.touches[1]);
      }

      // Start pan
      if (e.touches.length === 1) {
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
    });


    // Mobile: touch move
    main.addEventListener('touchmove', e => {
      e.preventDefault();

      // Pinch zoom
      if (e.touches.length === 2) {
        const d = distance(e.touches[0], e.touches[1]);

        if (lastDistance) {
          setZoom(zoom * d / lastDistance);
        }

        lastDistance = d;
      }

      // One-finger pan
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - lastX;
        const dy = e.touches[0].clientY - lastY;

        x += dx;
        y += dy;

        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;

        update();
      }
    }, { passive: false });


    // Reset pinch state
    main.addEventListener('touchend', () => {
      lastDistance = null;
    });


    function distance(a, b) {
      return Math.hypot(
        a.clientX - b.clientX,
        a.clientY - b.clientY
      );
    }
  </script>

</body>
</html>
